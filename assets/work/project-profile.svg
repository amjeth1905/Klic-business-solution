<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#0C0C0C" />
  
  <!-- Architectural Editorial Monograph Frame -->
  <rect x="40" y="40" width="720" height="420" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  
  <!-- Left Folio Page -->
  <rect x="80" y="80" width="300" height="340" fill="#141414" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  <line x1="110" y1="120" x2="200" y2="120" stroke="#16C653" stroke-width="2" />
  <text x="110" y="155" font-family="'Space Grotesk', monospace" font-size="9" fill="rgba(255, 255, 255, 0.4)" letter-spacing="0.2em">EXECUTIVE MONOGRAPH</text>
  <text x="110" y="195" font-family="'Syne', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="-0.03em">CAPITAL</text>
  <text x="110" y="225" font-family="'Syne', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="-0.03em">PARTNERS</text>
  <text x="110" y="260" font-family="'Space Grotesk', sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">ANNUAL STRATEGIC OVERVIEW</text>
  <text x="110" y="380" font-family="'Space Grotesk', monospace" font-size="9" fill="#16C653">FOLIO ED. 04 // 2026</text>

  <!-- Right Folio Page (Grid layout with typography) -->
  <rect x="420" y="80" width="300" height="340" fill="#141414" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  <line x1="450" y1="120" x2="690" y2="120" stroke="rgba(255, 255, 255, 0.08)" />
  <text x="450" y="150" font-family="'Syne', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">01. CORE INVESTMENT THESIS</text>
  
  <line x1="450" y1="180" x2="680" y2="180" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
  <line x1="450" y1="200" x2="650" y2="200" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
  <line x1="450" y1="220" x2="690" y2="220" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
  <line x1="450" y1="240" x2="580" y2="240" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />

  <!-- Abstract layout box in monograph -->
  <rect x="450" y="270" width="110" height="110" fill="#0A0A0A" stroke="#16C653" stroke-width="1" />
  <circle cx="505" cy="325" r="24" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
  <path d="M 485 325 H 525 M 505 305 V 345" stroke="#16C653" stroke-width="1.5" />

  <rect x="580" y="270" width="110" height="110" fill="#0A0A0A" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <text x="595" y="300" font-family="'Space Grotesk', monospace" font-size="8" fill="rgba(255, 255, 255, 0.4)">TOTAL AUM</text>
  <text x="595" y="325" font-family="'Syne', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">$850M</text>
  <text x="595" y="360" font-family="'Space Grotesk', monospace" font-size="8" fill="#16C653">+34% YOY</text>
</svg>
