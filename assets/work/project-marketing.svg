<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#080808" />
  
  <!-- Subtle Grid -->
  <defs>
    <pattern id="mkt-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
    <linearGradient id="curve-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16C653" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#16C653" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#16C653" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="area-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16C653" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#16C653" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#mkt-grid)" />
  <rect x="30" y="30" width="740" height="440" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Header telemetry -->
  <text x="60" y="70" font-family="'Space Grotesk', monospace" font-size="11" fill="#16C653" letter-spacing="0.2em">CAMPAIGN INTELLIGENCE // PERFORMANCE MATRIX</text>
  <text x="600" y="70" font-family="'Space Grotesk', monospace" font-size="11" fill="rgba(255, 255, 255, 0.4)" letter-spacing="0.15em">MULTI-CHANNEL ATTRIBUTION</text>
  <line x1="60" y1="85" x2="740" y2="85" stroke="rgba(255, 255, 255, 0.06)" />

  <!-- Metrics Bars / Architecture -->
  <rect x="60" y="110" width="180" height="70" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" />
  <text x="80" y="135" font-family="'Space Grotesk', monospace" font-size="10" fill="rgba(255, 255, 255, 0.4)">ROAS MULTIPLIER</text>
  <text x="80" y="165" font-family="'Syne', sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">4.82<tspan fill="#16C653" font-size="14">x</tspan></text>

  <rect x="260" y="110" width="180" height="70" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" />
  <text x="280" y="135" font-family="'Space Grotesk', monospace" font-size="10" fill="rgba(255, 255, 255, 0.4)">CONVERSION LIFT</text>
  <text x="280" y="165" font-family="'Syne', sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">+184<tspan fill="#16C653" font-size="14">%</tspan></text>

  <rect x="460" y="110" width="280" height="70" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" />
  <text x="480" y="135" font-family="'Space Grotesk', monospace" font-size="10" fill="rgba(255, 255, 255, 0.4)">QUALIFIED PIPELINE VELOCITY</text>
  <text x="480" y="165" font-family="'Syne', sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">OPTIMIZED<tspan fill="#16C653" font-size="12"> // REALTIME</tspan></text>

  <!-- Inflection Chart -->
  <!-- Background shaded area -->
  <path d="M 60 410 L 60 360 C 140 355 200 340 280 320 C 380 295 450 250 540 220 C 620 195 680 160 740 140 L 740 410 Z" fill="url(#area-fill)" />
  
  <!-- Curve Line -->
  <path d="M 60 360 C 140 355 200 340 280 320 C 380 295 450 250 540 220 C 620 195 680 160 740 140" stroke="url(#curve-gradient)" stroke-width="3" fill="none" />

  <!-- Data Nodes on curve -->
  <circle cx="280" cy="320" r="4" fill="#000000" stroke="#16C653" stroke-width="2" />
  <circle cx="540" cy="220" r="4" fill="#000000" stroke="#16C653" stroke-width="2" />
  <circle cx="740" cy="140" r="6" fill="#16C653" stroke="#FFFFFF" stroke-width="2" />

  <!-- Target Marker -->
  <line x1="740" y1="95" x2="740" y2="410" stroke="#16C653" stroke-width="1" stroke-dasharray="3 3" />
  <text x="730" y="125" font-family="'Space Grotesk', monospace" font-size="11" fill="#16C653" text-anchor="end">MAX INFLECTION POINT</text>
</svg>
