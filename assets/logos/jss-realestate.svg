    <rect x="6" y="20" width="12" height="34" stroke="currentColor" stroke-width="2" opacity="0.4" fill="none" />
    <rect x="22" y="8" width="14" height="46" stroke="#16C653" stroke-width="2.2" fill="none" />
    <rect x="40" y="26" width="10" height="28" stroke="currentColor" stroke-width="2" opacity="0.4" fill="none" />
    <line x1="2" y1="54" x2="54" y2="54" stroke="#16C653" stroke-width="2" />
    <!-- Window apertures -->
