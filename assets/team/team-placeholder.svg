<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" fill="none">
  <rect width="600" height="750" fill="#0E0E0E" />
  
  <!-- Subtle Technical Grid Lines -->
  <line x1="50" y1="50" x2="550" y2="50" stroke="rgba(255, 255, 255, 0.08)" />
  <line x1="50" y1="700" x2="550" y2="700" stroke="rgba(255, 255, 255, 0.08)" />
  <line x1="50" y1="50" x2="50" y2="700" stroke="rgba(255, 255, 255, 0.08)" />
  <line x1="550" y1="50" x2="550" y2="700" stroke="rgba(255, 255, 255, 0.08)" />

  <!-- Corner Brackets -->
  <path d="M 40 65 V 40 H 65" stroke="#16C653" stroke-width="1.5" fill="none" />
  <path d="M 560 65 V 40 H 535" stroke="#16C653" stroke-width="1.5" fill="none" />
  <path d="M 40 685 V 710 H 65" stroke="#16C653" stroke-width="1.5" fill="none" />
  <path d="M 560 685 V 710 H 535" stroke="#16C653" stroke-width="1.5" fill="none" />

  <!-- Center Portrait Framing -->
  <circle cx="300" cy="320" r="110" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  <circle cx="300" cy="320" r="118" stroke="#16C653" stroke-width="1" stroke-dasharray="8 8" />
  
  <!-- Stylized Silhouette Monogram -->
  <path d="M 300 250 C 270 250 250 275 250 305 C 250 335 270 355 300 355 C 330 355 350 335 350 305 C 350 275 330 250 300 250 Z" fill="rgba(255, 255, 255, 0.06)" />
  <path d="M 220 420 C 220 375 255 370 300 370 C 345 370 380 375 380 420 Z" fill="rgba(255, 255, 255, 0.06)" />

  <text x="300" y="475" font-family="'Space Grotesk', monospace" font-size="12" fill="#16C653" text-anchor="middle" letter-spacing="0.2em">PHOTO PLACEHOLDER</text>
  <text x="300" y="500" font-family="'Space Grotesk', sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.4)" text-anchor="middle" letter-spacing="0.05em">REPLACE WITH TEAM PORTRAIT</text>
  
  <!-- Minimal Coordinate at bottom -->
  <text x="75" y="675" font-family="'Space Grotesk', monospace" font-size="10" fill="rgba(255, 255, 255, 0.3)">KLIC TEAM ROSTER</text>
  <text x="525" y="675" font-family="'Space Grotesk', monospace" font-size="10" fill="rgba(255, 255, 255, 0.3)" text-anchor="end">4:5 PORTRAIT</text>
</svg>
